name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      guide: ${{ steps.filter.outputs.guide }}
      parser: ${{ steps.filter.outputs.parser }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Detect changed workspaces
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.json

  guide:
    needs: changes
    if: needs.changes.outputs.guide == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build the guide
        run: pnpm turbo run build --filter=@ediocracy/guide

  parser:
    needs: changes
    if: needs.changes.outputs.parser == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the parser
        run: pnpm turbo run check --filter=@ediocracy/parser

  required:
    if: always()
    needs: [changes, guide, parser]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GUIDE_RESULT: ${{ needs.guide.result }}
          PARSER_RESULT: ${{ needs.parser.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$GUIDE_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$PARSER_RESULT" in success|skipped) ;; *) exit 1 ;; esac
