glob_matcher: doublestar

prepare-commit-msg:
  commands:
    commitizen:
      interactive: true
      run: pnpm cz --hook
      env:
        LEFTHOOK: "0"

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    guide-check:
      glob:
        - "apps/guide/**"
        - "package.json"
        - "pnpm-lock.yaml"
        - "pnpm-workspace.yaml"
        - "turbo.json"
        - "lefthook.yml"
      run: pnpm turbo run build --filter=@ediocracy/guide

    parser-check:
      glob:
        - "packages/parser/**"
        - "package.json"
        - "pnpm-lock.yaml"
        - "pnpm-workspace.yaml"
        - "turbo.json"
        - "lefthook.yml"
      run: pnpm turbo run check --filter=@ediocracy/parser
