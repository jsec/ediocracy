glob_matcher: doublestar

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    guide-check:
      glob:
        - "apps/guide/**"
        - "packages/parser/src/**"
        - "package.json"
        - "pnpm-lock.yaml"
        - "pnpm-workspace.yaml"
        - "turbo.json"
        - "lefthook.yml"
      run: pnpm turbo run build --filter=@ediocracy/guide

    parser-check:
      glob:
        - "packages/parser/**"
        - "package.json"
        - "pnpm-lock.yaml"
        - "pnpm-workspace.yaml"
        - "turbo.json"
        - "lefthook.yml"
      run: pnpm turbo run check --filter=@ediocracy/parser
